function add(tag,id,label,attrs){const el=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));el.id=id;el.dataset.label=label;el.setAttribute('class','part');el.setAttribute('role','button');el.setAttribute('tabindex','0');const saved=state[id];el.setAttribute('fill',typeof saved==='string'&&/^#[0-9a-f]{6}$/i.test(saved)?saved:'#ffffff');el.setAttribute('aria-label',label+'をぬる');el.addEventListener('click',()=>paint(el));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();paint(el)}});group.append(el)}

// 和柄はすべて閉じたSVG区画。背景画像ではなく一つずつ着色できる。
function detail(tag,id,label,attrs){add(tag,id,label,{...attrs,style:'stroke-width:2;stroke-linecap:round;stroke-linejoin:round'})}
function point(x,y,r,a){return [x+r*Math.cos(a*Math.PI/180),y+r*Math.sin(a*Math.PI/180)]}
function fan(id,x,y,r,start,end,n){
 for(let i=0;i<n;i++){const a=start+(end-start)*i/n,b=start+(end-start)*(i+1)/n,A=point(x,y,r,a),B=point(x,y,r,b);detail('path',id+'-fold'+i,'扇の区画'+(i+1),{d:`M${x} ${y} L${A} A${r} ${r} 0 0 1 ${B} Z`})}
 // 内側の折り目は細い線のみで、色のつく面を覆わない。
 detail('circle',id+'-pivot','扇のかなめ',{cx:x,cy:y,r:9});
}
function mum(id,x,y,r,count=12){
 for(let ring=0;ring<2;ring++){const size=ring===0?r:r*.62,cy=y-size*.52;for(let i=0;i<count;i++){detail('ellipse',id+'-r'+ring+'-p'+i,'菊の花びら'+(ring*count+i+1),{cx:x,cy,rx:size*.18,ry:size*.50,transform:`rotate(${360*i/count+ring*15} ${x} ${y})`})}}
 detail('circle',id+'-center','菊の花の中心',{cx:x,cy:y,r:r*.17});
}
function blossom(id,x,y,r){

}
function leaf(id,x,y,r,angle){

}

function loadDrawing(id){current=id;state={};history=[];storageOK=true;try{const v=JSON.parse(localStorage.getItem(current==='flower'?KEY:'digital-nurie-'+current+'-v1')||'{}');if(v&&typeof v==='object'&&!Array.isArray(v))state=v}catch(e){storageOK=false}group.replaceChildren();const drawing=drawings.find(d=>d[0]===id);drawing[2]();resetZoom();undo.disabled=true;document.querySelector('h1').textContent=drawing[1]+'のぬりえ';document.querySelector('#art').setAttribute('aria-label',drawing[1]+'のぬりえ');document.querySelector('.paper').setAttribute('aria-label',drawing[1]+'のぬりえ');document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));status.textContent='色をえらんで、ぬりたいところを押してください。'}

let zoom=1,viewX=0,viewY=0;
function updateZoom(){const w=700/zoom,h=720/zoom;viewX=Math.max(0,Math.min(700-w,viewX));viewY=Math.max(0,Math.min(720-h,viewY));document.querySelector('#art').setAttribute('viewBox',`${viewX} ${viewY} ${w} ${h}`);document.querySelector('#zoomLevel').textContent=Math.round(zoom*100)+'%';document.querySelector('#pan').hidden=zoom===1;document.querySelector('#zoomOut').disabled=zoom===1;document.querySelector('#zoomIn').disabled=zoom===4}
function resetZoom(){zoom=1;viewX=0;viewY=0;updateZoom()}
function changeZoom(next){const cx=viewX+350/zoom,cy=viewY+360/zoom;zoom=Math.max(1,Math.min(4,next));viewX=cx-350/zoom;viewY=cy-360/zoom;updateZoom()}
 document.querySelector('#zoomIn').onclick=()=>changeZoom(zoom+.5);document.querySelector('#zoomOut').onclick=()=>changeZoom(zoom-.5);document.querySelector('#zoomReset').onclick=resetZoom;
