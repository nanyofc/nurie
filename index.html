<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お花のぬりえ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ee;color:#293d39;font-family:system-ui,-apple-system,sans-serif}header{max-width:1200px;margin:auto;padding:22px 24px 12px}h1{margin:0 0 8px;font-size:clamp(24px,4vw,36px)}p{margin:6px 0;font-size:20px}main{max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 260px;gap:20px;padding:12px 24px 24px}.paper{background:white;border:2px solid #dedbd3;border-radius:24px;overflow:hidden}svg{display:block;width:100%;max-height:70vh;min-height:360px;touch-action:manipulation}.part{stroke:#35443e;stroke-width:4;stroke-linejoin:round;cursor:pointer;outline:none}.part:focus-visible{stroke:#154cfa;stroke-width:7}aside{background:#fff;border-radius:24px;padding:18px}h2{font-size:22px;margin:0 0 14px}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.swatch{min-height:60px;border:3px solid #b4b4b4;border-radius:15px;position:relative;cursor:pointer}.swatch[aria-pressed=true]{outline:4px solid #233c34;outline-offset:3px}.swatch[aria-pressed=true]:after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#111;font-size:30px;text-shadow:0 0 4px white,0 0 4px white}button{font:inherit;touch-action:manipulation}button:focus-visible{outline:4px solid #154cfa;outline-offset:3px}.action{display:block;width:100%;padding:14px 8px;min-height:58px;margin-top:14px;border:2px solid #c1cec7;border-radius:14px;background:#eef4ef;color:#293d39;font-size:20px;font-weight:700;cursor:pointer}.action:disabled{opacity:.45;cursor:default}#status{font-size:16px;min-height:48px;margin-top:16px}dialog{border:0;border-radius:20px;padding:26px;max-width:90vw}dialog::backdrop{background:#0007}.dialog-buttons{display:flex;gap:16px}.dialog-buttons button{min-width:120px}footer{text-align:center;padding:0 20px 20px;color:#53635c}@media(max-width:750px){main{grid-template-columns:1fr;padding:10px 14px;gap:12px}header{padding:16px 16px 6px}aside{padding:16px}.palette{grid-template-columns:repeat(6,1fr);gap:10px}.swatch{min-height:52px}.actions{display:flex;gap:10px}.action{font-size:17px}svg{min-height:300px;max-height:56vh}h2{font-size:20px}p{font-size:18px}}@media print{header,aside,footer{display:none}main{display:block;padding:0}.paper{border:none}svg{max-height:none;height:90vh}}
</style>
<header><h1>お花のぬりえ</h1><p>① 色をえらぶ　② ぬりたいところを押す</p></header>
<main><section class="paper" aria-label="花びらを一枚ずつ塗れるお花"><svg id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 720" aria-label="お花のぬりえ"><g id="parts"></g></svg></section>
<aside><h2 id="colorLabel">いまの色：あか</h2><div class="palette" id="palette" aria-label="色をえらぶ"></div><div class="actions"><button class="action" id="undo" disabled>ひとつ戻す</button><button class="action" id="save">作品を保存</button><button class="action" id="reset">はじめから</button></div><p id="status" role="status" aria-live="polite">花びらは1枚ずつ、好きな色にできます。</p></aside></main>
<footer>途中でもお休みできます。続きは同じ端末・同じブラウザで。</footer>
<dialog id="confirm"><h2>全部の色を白にもどしますか？</h2><p>「ひとつ戻す」で元に戻せます。</p><div class="dialog-buttons"><button class="action" id="cancel">やめる</button><button class="action" id="clear">白にもどす</button></div></dialog>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg',KEY='digital-nurie-flower-v1';
const colors=[['あか','#ef6865'],['オレンジ','#f6a34c'],['きいろ','#f5d94e'],['きみどり','#add16a'],['みどり','#56a875'],['みずいろ','#83cee7'],['あお','#6c9cdb'],['むらさき','#ae8ad0'],['ピンク','#efa9c6'],['ちゃいろ','#af8261'],['グレー','#acb3bb'],['しろ','#ffffff']];
let selected=colors[0],history=[],state={},storageOK=true;
const group=document.querySelector('#parts'),status=document.querySelector('#status'),undo=document.querySelector('#undo');
try{const value=JSON.parse(localStorage.getItem(KEY)||'{}');if(value&&typeof value==='object'&&!Array.isArray(value))state=value}catch(e){storageOK=false}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false}if(!storageOK)status.textContent='この環境では途中保存できません。「作品を保存」をご利用ください。'}
function add(tag,id,label,attrs){const el=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));el.id=id;el.dataset.label=label;el.setAttribute('class','part');el.setAttribute('role','button');el.setAttribute('tabindex','0');const saved=state[id];el.setAttribute('fill',typeof saved==='string'&&/^#[0-9a-f]{6}$/i.test(saved)?saved:'#ffffff');el.setAttribute('aria-label',label+'をぬる');el.addEventListener('click',()=>paint(el));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();paint(el)}});group.append(el)}
// 茎・葉・花びら・中心は、すべて独立した塗り区画。
add('path','stem','くき',{d:'M335 330 Q330 480 341 653 L364 653 Q352 480 367 330 Z'});
add('path','leaf-left','左の葉っぱ',{d:'M345 543 C240 553 170 479 158 423 C248 413 321 452 345 543 Z'});
add('path','leaf-right','右の葉っぱ',{d:'M356 594 C455 603 524 533 539 474 C449 461 379 502 356 594 Z'});
for(let i=0;i<8;i++)add('ellipse','petal-'+i,'花びら'+(i+1),{cx:350,cy:171,rx:57,ry:104,transform:'rotate('+(i*45)+' 350 300)'});
add('circle','center','花のまんなか',{cx:350,cy:300,r:72});
function paint(el){const before=el.getAttribute('fill');if(before===selected[1])return;history.push({...state});state[el.id]=selected[1];el.setAttribute('fill',selected[1]);undo.disabled=false;status.textContent=el.dataset.label+'を'+selected[0]+'にぬりました。';persist()}
function render(){document.querySelectorAll('.part').forEach(el=>{const v=state[el.id];el.setAttribute('fill',typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v)?v:'#ffffff')});undo.disabled=!history.length}
colors.forEach(color=>{const b=document.createElement('button');b.className='swatch';b.style.background=color[1];b.setAttribute('aria-label',color[0]);b.title=color[0];b.setAttribute('aria-pressed',String(color===selected));b.onclick=()=>{selected=color;document.querySelectorAll('.swatch').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#colorLabel').textContent='いまの色：'+color[0]};document.querySelector('#palette').append(b)});
undo.onclick=()=>{if(!history.length)return;state=history.pop();render();status.textContent='ひとつ前にもどしました。';persist()};
const dialog=document.querySelector('#confirm');document.querySelector('#reset').onclick=()=>dialog.showModal();document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#clear').onclick=()=>{history.push({...state});state={};render();persist();dialog.close();status.textContent='白にもどしました。好きな色で始めましょう。'};
document.querySelector('#save').onclick=()=>{const svg=document.querySelector('#art').cloneNode(true);svg.setAttribute('width','1400');svg.setAttribute('height','1440');const bg=document.createElementNS(NS,'rect');bg.setAttribute('width','700');bg.setAttribute('height','720');bg.setAttribute('fill','white');svg.insertBefore(bg,svg.firstChild);svg.querySelectorAll('.part').forEach(el=>{el.setAttribute('stroke','#35443e');el.setAttribute('stroke-width','4');el.removeAttribute('tabindex')});const blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=1400;canvas.height=1440;canvas.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);canvas.toBlob(png=>{if(!png){status.textContent='保存できませんでした。もう一度お試しください。';return}const link=document.createElement('a'),downloadURL=URL.createObjectURL(png);link.href=downloadURL;link.download='ohanano-nurie.png';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(downloadURL),60000);status.textContent='作品の保存を開始しました。'},'image/png')};img.onerror=()=>{URL.revokeObjectURL(url);status.textContent='保存できませんでした。'};img.src=url};
if(!storageOK)status.textContent='途中保存が使えない環境です。「作品を保存」をご利用ください。';
</script>
</html>
